<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#103273">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Station Timer">
<title>Station Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --accent:#103273; --accent-2:#1d4fae; --bg:#f4f6fa; --card:#ffffff; --text:#14181f;
  --muted:#5b6575; --line:#dde2ea; --ok:#14804a; --warn:#b26a00; --danger:#b42318;
  --active:#e6eefc; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --accent:#6f9cff; --accent-2:#8fb2ff; --bg:#0f131a; --card:#181e28; --text:#e8ecf2;
    --muted:#9aa5b5; --line:#2a3342; --active:#1d2a44; --ok:#3fbf7f; --warn:#e3a53c; --danger:#f0675c; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header.bar h1{font-size:1.3rem;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:1.05rem;margin:22px 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--line);color:var(--text);
  min-height:44px;touch-action:manipulation}
button.primary{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){ button.primary{color:#0b1020} }
button.ghost{background:transparent;color:var(--accent);padding:8px 10px}
button.danger{background:transparent;color:var(--danger)}
button.big{width:100%;font-size:1.1rem;padding:16px;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=number]{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--text);width:100%;min-height:44px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.proj{display:flex;align-items:center;gap:12px;cursor:pointer}
.proj .meta{font-size:.85rem;color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--active);color:var(--accent);font-weight:600}
.pill.warn{background:#fff1d6;color:var(--warn)}
@media (prefers-color-scheme: dark){ .pill.warn{background:#3a2c10} }
.taskdef{display:grid;grid-template-columns:56px 1fr 44px;gap:8px;margin-bottom:8px;align-items:center}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}

/* Observation screen */
.obs-top{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;margin:-16px -16px 14px;padding:12px 16px 14px;
  padding-top:calc(12px + env(safe-area-inset-top))}
@media (prefers-color-scheme: dark){ .obs-top{background:#13254d} }
.obs-top .t-main{font-variant-numeric:tabular-nums;font-size:2.6rem;font-weight:700;letter-spacing:.02em;line-height:1.1}
.obs-top .t-task{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:600;opacity:.95}
.obs-top .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.obs-top .cur{font-size:.95rem;margin-top:4px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obs-top button{background:rgba(255,255,255,.18);color:#fff}
.obs-top button.go{background:#fff;color:var(--accent)}
.obs-top button.stop{background:#e5484d;color:#fff}
.timers{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.tasklist .tbtn{display:flex;width:100%;text-align:left;gap:12px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;margin-bottom:8px;min-height:60px;font-size:1.05rem}
.tasklist .tbtn .num{font-weight:700;color:var(--accent);min-width:2.2em;font-variant-numeric:tabular-nums}
.tasklist .tbtn .cnt{margin-left:auto;font-size:.8rem;color:var(--muted)}
.tasklist .tbtn.on{background:var(--active);border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.tasklist .tbtn:active{transform:scale(.99)}
.newtask{display:flex;gap:8px;align-items:center;border:1px dashed var(--line);border-radius:var(--radius);padding:10px;background:var(--card)}
.newtask.on{border:1px solid var(--accent);background:var(--active);box-shadow:inset 4px 0 0 var(--accent)}
.newtask .num{font-weight:700;color:var(--muted);min-width:2.2em;padding-left:4px}
.paused-banner{background:#fff1d6;color:#6b4200;border-radius:10px;padding:8px 12px;margin-top:10px;font-weight:600}

/* Results */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--active);font-weight:600}
td.r,th.r{text-align:right}
tr.total td{font-weight:700;border-top:2px solid var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.kpi .v{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k{font-size:.8rem;color:var(--muted)}

/* Sheet / modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){ .modal{align-items:center} .modal .sheet{border-radius:16px} }
.modal h3{margin:0 0 8px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14181f;color:#fff;
  padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===================== Storage ===================== */
const KEY = 'stationTimer.projects.v1';
let memStore = null; // fallback if localStorage unavailable
function loadAll(){
  try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : []; }
  catch(e){ return memStore || []; }
}
function saveAll(list){
  memStore = list;
  try{ localStorage.setItem(KEY, JSON.stringify(list)); }
  catch(e){ toast('Warning: could not save to device storage'); }
}
let projects = loadAll();
function persist(){ saveAll(projects); }
function getProject(id){ return projects.find(p => p.id === id); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ===================== Helpers ===================== */
const $app = document.getElementById('app');
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n, w=2){ return String(n).padStart(w,'0'); }
function fmtDur(ms, tenths=true){
  if(ms < 0) ms = 0;
  const totalT = Math.floor(ms/100);
  const t = totalT % 10, s = Math.floor(totalT/10) % 60, m = Math.floor(totalT/600) % 60, h = Math.floor(totalT/36000);
  return `${pad(h)}:${pad(m)}:${pad(s)}` + (tenths ? `.${t}` : '');
}
function fmtDate(ms){ const d = new Date(ms); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function fmtClock(ms){ const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function fmtDateTime(ms){ return `${fmtDate(ms)} ${fmtClock(ms).slice(0,5)}`; }
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function nextTaskNum(p){ return p.tasks.reduce((m,t) => Math.max(m, Number(t.num)||0), 0) + 1; }
function sortedTasks(p){ return [...p.tasks].sort((a,b) => (a.num - b.num)); }

function modal({title, body='', actions}){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet"><h3>${esc(title)}</h3><div>${body}</div><div class="acts"></div></div>`;
  const acts = m.querySelector('.acts');
  actions.forEach(a => {
    const b = document.createElement('button'); b.textContent = a.label; if(a.cls) b.className = a.cls;
    b.onclick = () => { const keep = a.onClick && a.onClick(m) === false; if(!keep) m.remove(); };
    acts.appendChild(b);
  });
  m.addEventListener('click', e => { if(e.target === m && !actions.noDismiss) m.remove(); });
  document.body.appendChild(m);
  const inp = m.querySelector('input'); if(inp) setTimeout(() => inp.focus(), 50);
  return m;
}
function confirmBox(title, body, okLabel, onOk, danger=true){
  modal({title, body:`<p class="muted">${body}</p>`, actions:[
    {label:'Cancel'}, {label:okLabel, cls: danger ? 'primary' : 'primary', onClick:onOk}
  ]});
}

/* ===================== Session timing model =====================
 session = { id, created, startWall, events:[{taskId, wall, el}], pauses:[{from, to}],
             status:'ready'|'running'|'paused'|'stopped', endWall, endEl }
 el = active elapsed ms since first task tap, excluding paused time.            */
function pausedMs(s, now){
  return s.pauses.reduce((sum,p) => sum + ((p.to ?? now) - p.from), 0);
}
function elapsed(s, now = Date.now()){
  if(!s.startWall) return 0;
  if(s.status === 'stopped') return s.endEl;
  return now - s.startWall - pausedMs(s, now);
}
function currentEvent(s){ return s.events[s.events.length-1]; }
function rowsFor(p, s){
  const tmap = Object.fromEntries(p.tasks.map(t => [t.id, t]));
  return s.events.map((e,i) => {
    const nextEl = i < s.events.length-1 ? s.events[i+1].el : (s.status === 'stopped' ? s.endEl : elapsed(s));
    const t = tmap[e.taskId] || {num:'?', name:'(deleted task)'};
    return { idx:i+1, num:t.num, name:t.name, taskId:e.taskId, wall:e.wall, el:e.el, dur: nextEl - e.el };
  });
}
function summaryFor(p, s){
  const rows = rowsFor(p, s); const total = s.endEl || 0; const by = {};
  rows.forEach(r => {
    const k = r.taskId; by[k] = by[k] || {num:r.num, name:r.name, count:0, total:0, min:Infinity, max:0};
    const o = by[k]; o.count++; o.total += r.dur; o.min = Math.min(o.min, r.dur); o.max = Math.max(o.max, r.dur);
  });
  const list = Object.values(by).sort((a,b) => a.num - b.num);
  list.forEach(o => { o.avg = o.total/o.count; o.pct = total ? o.total/total : 0; });
  return list;
}

/* ===================== Router ===================== */
let view = {name:'home'};
let tick = null;
function go(v){
  view = v; clearInterval(tick); tick = null;
  window.scrollTo(0,0); render();
}
function render(){
  ({home:renderHome, tasks:renderTasks, project:renderProject, observe:renderObserve, results:renderResults})[view.name]();
}

/* ===================== Home: project library ===================== */
function renderHome(){
  const list = [...projects].sort((a,b) => b.updated - a.updated);
  $app.innerHTML = `
    <header class="bar"><h1>Station Timer</h1>
      <button class="ghost" id="menu" aria-label="More">•••</button></header>
    <button class="primary big" id="new">+ New project</button>
    <h2>Projects</h2>
    ${list.length ? list.map(p => {
      const open = p.sessions.some(s => s.status !== 'stopped' && s.events.length);
      const done = p.sessions.filter(s => s.status === 'stopped').length;
      return `<div class="card proj" data-id="${p.id}">
        <div class="grow"><div><strong>${esc(p.name)}</strong> ${open ? '<span class="pill warn">In progress</span>' : ''}</div>
        <div class="meta">${p.tasks.length} task${p.tasks.length===1?'':'s'} · ${done} completed study${done===1?'':'ies'} · updated ${fmtDateTime(p.updated)}</div></div>
        <span class="muted">›</span></div>`;
    }).join('') : `<div class="empty">No projects yet.<br>Start one with <strong>New project</strong>.</div>`}
  `;
  document.getElementById('new').onclick = newProject;
  document.getElementById('menu').onclick = homeMenu;
  $app.querySelectorAll('.proj').forEach(el => el.onclick = () => go({name:'project', id:el.dataset.id}));
}
function newProject(){
  modal({title:'New project', body:`<input type="text" id="pname" placeholder="e.g. Line 3 – Assembly station" maxlength="80">`,
    actions:[{label:'Cancel'}, {label:'Create', cls:'primary', onClick:(m) => {
      const name = m.querySelector('#pname').value.trim();
      if(!name){ toast('Please enter a project name'); return false; }
      const p = {id:uid(), name, created:Date.now(), updated:Date.now(), tasks:[], sessions:[]};
      projects.push(p); persist(); go({name:'tasks', id:p.id, fresh:true});
    }}]});
  const inp = document.getElementById('pname');
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') inp.closest('.sheet').querySelector('.primary').click(); });
}
function homeMenu(){
  modal({title:'Backup & transfer', body:`<p class="muted small">Data is stored on this device only. Use a backup file to move projects between phone, tablet and computer.</p>`,
    actions:[
      {label:'Import backup', onClick:() => importBackup()},
      {label:'Export backup', cls:'primary', onClick:() => {
        const blob = new Blob([JSON.stringify({app:'StationTimer', version:1, exported:Date.now(), projects}, null, 1)], {type:'application/json'});
        downloadBlob(blob, `station-timer-backup-${fileStamp(Date.now())}.json`);
      }}
    ]});
}
function importBackup(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    try{
      const data = JSON.parse(await inp.files[0].text());
      const incoming = Array.isArray(data) ? data : data.projects;
      if(!Array.isArray(incoming)) throw 0;
      let added = 0, replaced = 0;
      incoming.forEach(p => {
        if(!p || !p.id || !Array.isArray(p.tasks) || !Array.isArray(p.sessions)) return;
        const i = projects.findIndex(x => x.id === p.id);
        if(i >= 0){ if((p.updated||0) >= (projects[i].updated||0)){ projects[i] = p; replaced++; } }
        else { projects.push(p); added++; }
      });
      persist(); render(); toast(`Imported: ${added} new, ${replaced} updated`);
    }catch(e){ toast('That file is not a valid backup'); }
  };
  inp.click();
}

/* ===================== Task definition ===================== */
function renderTasks(){
  const p = getProject(view.id); if(!p) return go({name:'home'});
  // working copy so the user can cancel edits on an existing project
  if(!view.draft) view.draft = sortedTasks(p).map(t => ({...t}));
  const d = view.draft;
  $app.innerHTML = `
    <header class="bar"><button class="ghost" id="back">‹ Back</button><h1>${esc(p.name)}</h1></header>
    <p class="muted">Enter the tasks you will observe. Numbers are assigned automatically in the order you enter them.</p>
    <div class="row small muted" style="margin:0 0 6px"><div style="width:56px;text-align:center">No.</div><div class="grow">Task name</div></div>
    <div id="rows">${d.map((t,i) => `
      <div class="taskdef" data-i="${i}">
        <div style="font-weight:700;color:var(--accent);text-align:center;font-size:1.1rem">${esc(t.num)}</div>
        <input type="text" value="${esc(t.name)}" placeholder="Task name" data-f="name" maxlength="100">
        <button class="danger" data-del="${i}" aria-label="Remove">✕</button>
      </div>`).join('')}</div>
    <button id="add" style="width:100%">+ Add task</button>
    <div class="row wrapr" style="margin-top:22px">
      <button class="grow" id="saveHome">Save &amp; return to projects</button>
      <button class="primary grow" id="saveCont">Save &amp; continue</button>
    </div>
    <div style="margin-top:14px"><button class="ghost" id="rename">Rename project</button></div>
  `;
  const sync = () => {
    $app.querySelectorAll('.taskdef').forEach(r => {
      d[+r.dataset.i].name = r.querySelector('[data-f=name]').value;
    });
  };
  // Before any timings exist, numbers simply follow entry order (1, 2, 3…).
  // Once timings are recorded, existing numbers are frozen so results stay consistent.
  const hasTimings = p.sessions.some(s => s.events.length);
  const renumber = () => { if(!hasTimings) d.forEach((t,i) => t.num = i+1); };
  document.getElementById('add').onclick = () => {
    sync();
    const max = d.reduce((m,t) => Math.max(m, Number(t.num)||0), 0);
    d.push({id:uid(), num:max+1, name:''}); renderTasks();
    const ins = $app.querySelectorAll('[data-f=name]'); ins[ins.length-1].focus();
  };
  $app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    sync(); const i = +b.dataset.del; const t = d[i];
    const used = p.sessions.some(s => s.events.some(e => e.taskId === t.id));
    if(used){ toast('This task has recorded timings and cannot be removed'); return; }
    d.splice(i,1); renumber(); renderTasks();
  });
  document.getElementById('rows').addEventListener('keydown', e => {
    if(e.key === 'Enter' && e.target.dataset.f === 'name'){ e.preventDefault(); document.getElementById('add').click(); }
  });
  const save = () => {
    sync();
    // Blank rows are dropped (unless they already carry timings), then numbering is tidied
    const clean = d.filter(t => t.name.trim() || p.sessions.some(s => s.events.some(e => e.taskId === t.id)));
    for(const t of clean){ if(!t.name.trim()){ toast(`Task ${t.num} needs a name`); return false; } }
    if(!hasTimings) clean.forEach((t,i) => t.num = i+1);
    p.tasks = clean.map(t => ({id:t.id, num:Number(t.num), name:t.name.trim()}));
    p.updated = Date.now(); persist(); return true;
  };
  document.getElementById('saveHome').onclick = () => { if(save()){ toast('Project saved'); go({name:'home'}); } };
  document.getElementById('saveCont').onclick = () => { if(save()) go({name:'project', id:p.id}); };
  document.getElementById('back').onclick = () => go(view.fresh && !p.tasks.length ? {name:'home'} : {name:'project', id:p.id});
  document.getElementById('rename').onclick = () => {
    sync();
    modal({title:'Rename project', body:`<input type="text" id="pname" value="${esc(p.name)}" maxlength="80">`,
      actions:[{label:'Cancel'},{label:'Save', cls:'primary', onClick:(m) => {
        const v = m.querySelector('#pname').value.trim(); if(!v) return false;
        p.name = v; p.updated = Date.now(); persist(); renderTasks();
      }}]});
  };
  if(!d.length) document.getElementById('add').click();
}

/* ===================== Project page ===================== */
function renderProject(){
  const p = getProject(view.id); if(!p) return go({name:'home'});
  const open = p.sessions.find(s => s.status !== 'stopped');
  const done = p.sessions.filter(s => s.status === 'stopped').sort((a,b) => b.startWall - a.startWall);
  $app.innerHTML = `
    <header class="bar"><button class="ghost" id="back">‹ Projects</button><h1>${esc(p.name)}</h1></header>
    ${open && open.events.length
      ? `<button class="primary big" id="resume">Resume observation in progress</button>
         <p class="small muted" style="text-align:center">Started ${fmtDateTime(open.startWall)} · ${open.events.length} timings recorded</p>`
      : `<button class="primary big" id="start" ${p.tasks.length ? '' : ''}>▶ Start observations</button>`}
    <h2>Tasks (${p.tasks.length})</h2>
    <div class="card">
      ${p.tasks.length ? sortedTasks(p).map(t => `<div class="row" style="padding:4px 0"><strong style="min-width:2.2em;color:var(--accent)">${t.num}</strong><span>${esc(t.name)}</span></div>`).join('')
        : '<div class="muted">No tasks defined yet – you can also add them during observation.</div>'}
      <div style="margin-top:8px"><button class="ghost" id="edit">Edit tasks</button></div>
    </div>
    <h2>Completed studies (${done.length})</h2>
    ${done.length ? done.map(s => `
      <div class="card proj" data-sid="${s.id}">
        <div class="grow"><strong>${fmtDateTime(s.startWall)}</strong>
        <div class="meta">${s.events.length} timings · total ${fmtDur(s.endEl, false)}</div></div><span class="muted">›</span></div>`).join('')
      : '<div class="muted small">None yet.</div>'}
    <div style="margin-top:28px"><button class="danger" id="del">Delete project</button></div>
  `;
  document.getElementById('back').onclick = () => go({name:'home'});
  document.getElementById('edit').onclick = () => go({name:'tasks', id:p.id});
  const st = document.getElementById('start') || document.getElementById('resume');
  st.onclick = () => {
    let s = p.sessions.find(x => x.status !== 'stopped');
    if(!s){ s = {id:uid(), created:Date.now(), startWall:null, events:[], pauses:[], status:'ready'}; p.sessions.push(s); persist(); }
    go({name:'observe', id:p.id, sid:s.id});
  };
  $app.querySelectorAll('[data-sid]').forEach(el => el.onclick = () => go({name:'results', id:p.id, sid:el.dataset.sid}));
  document.getElementById('del').onclick = () => confirmBox('Delete project?',
    `“${esc(p.name)}” and all its timings will be permanently removed from this device.`, 'Delete', () => {
      projects = projects.filter(x => x.id !== p.id); persist(); go({name:'home'});
    });
}

/* ===================== Observation ===================== */
/* Timing is based on the real clock (timestamps), not on a counter, so it keeps
   running correctly while the phone screen is off or the app is in the background.
   When the screen comes back on, the display catches up instantly. */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && view.name === 'observe') updateClocks();
});
window.addEventListener('pageshow', () => { if(view.name === 'observe') updateClocks(); });

function renderObserve(){
  const p = getProject(view.id); const s = p && p.sessions.find(x => x.id === view.sid);
  if(!s) return go({name:'home'});
  const cur = currentEvent(s);
  const counts = {}; s.events.forEach(e => counts[e.taskId] = (counts[e.taskId]||0) + 1);
  const curTask = cur && p.tasks.find(t => t.id === cur.taskId);
  const paused = s.status === 'paused';
  const pend = pendingTask(p);
  $app.innerHTML = `
    <div class="obs-top">
      <div class="row">
        <div class="grow timers">
          <div><div class="lbl">Total time</div><div class="t-main" id="tMain">${fmtDur(elapsed(s))}</div></div>
          <div><div class="lbl">Current task</div><div class="t-task" id="tTask">${cur ? fmtDur(elapsed(s) - cur.el) : '--:--:--.-'}</div></div>
        </div>
      </div>
      <div class="cur" id="curLbl">${curTask ? `<strong>${curTask.num}</strong> · ${curTask.pending ? 'New task (enter name below)' : esc(curTask.name)}` : (s.status === 'ready' ? 'Tap a task to start timing' : '')}</div>
      <div class="row" style="margin-top:10px">
        ${s.status === 'running' ? `<button id="pause" class="grow">❚❚ Pause</button>` : ''}
        ${paused ? `<button id="resume" class="go grow">▶ Resume</button><button id="stop" class="stop grow">■ Stop</button>` : ''}
        ${s.status === 'ready' ? `<button id="exit" class="grow">‹ Back to project</button>` : ''}
      </div>
      ${paused ? `<div class="paused-banner">Paused – timing is on hold</div>` : ''}
    </div>
    <div class="tasklist">
      ${sortedTasks(p).filter(t => !t.pending).map(t => `
        <button class="tbtn ${cur && cur.taskId === t.id && !paused ? 'on' : ''}" data-tid="${t.id}" ${paused ? 'disabled' : ''}>
          <span class="num">${t.num}</span><span>${esc(t.name)}</span><span class="cnt">${counts[t.id] ? '×' + counts[t.id] : ''}</span>
        </button>`).join('')}
      <div class="newtask ${pend && cur && cur.taskId === pend.id && !paused ? 'on' : ''}" id="newBox">
        <span class="num">${pend ? pend.num : nextTaskNum(p)}</span>
        <input type="text" id="newTask" class="grow" placeholder="New / unexpected task…" maxlength="100" enterkeyhint="done" value="${esc(view.newText || '')}">
        <button id="addTask" class="primary">Add</button>
      </div>
    </div>
  `;
  $app.querySelectorAll('[data-tid]').forEach(b => b.onclick = () => tapTask(p, s, b.dataset.tid));
  const inp = document.getElementById('newTask');
  const addNew = () => {
    const name = inp.value.trim();
    if(!name){ inp.focus(); return; }
    const t = commitPending(p, name) || (() => { const t = {id:uid(), num:nextTaskNum(p), name}; p.tasks.push(t); return t; })();
    view.newText = ''; p.updated = Date.now(); persist();
    renderObserve(); toast(`Task ${t.num} added`);
  };
  // Clicking into the new-task box starts timing the new task straight away.
  const startNew = () => {
    if(s.status === 'paused' || s.status === 'stopped' || pendingTask(p)) return;
    const now = Date.now();
    if(s.status === 'ready'){ s.startWall = now; s.status = 'running'; }
    const t = {id:uid(), num:nextTaskNum(p), name:'', pending:true}; p.tasks.push(t);
    s.events.push({taskId:t.id, wall:now, el:elapsed(s, now)});
    p.updated = now; persist();
    // update the screen without redrawing it, so the keyboard stays open
    $app.querySelectorAll('.tbtn.on').forEach(b => b.classList.remove('on'));
    document.getElementById('newBox').classList.add('on');
    document.getElementById('curLbl').innerHTML = `<strong>${t.num}</strong> · New task (enter name below)`;
    const ex = document.getElementById('exit');
    if(ex){ ex.outerHTML = `<button id="pause" class="grow">❚❚ Pause</button>`; document.getElementById('pause').onclick = doPause; }
  };
  inp.addEventListener('pointerdown', startNew);
  inp.addEventListener('focus', startNew);
  inp.addEventListener('input', () => view.newText = inp.value);
  document.getElementById('addTask').onclick = addNew;
  inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); addNew(); } });
  const doPause = () => { s.pauses.push({from:Date.now(), to:null}); s.status = 'paused'; persist(); renderObserve(); };
  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };
  on('pause', doPause);
  on('resume', () => { const lp = s.pauses[s.pauses.length-1]; if(lp && lp.to == null) lp.to = Date.now(); s.status = 'running'; persist(); renderObserve(); });
  on('stop', () => stopSession(p, s));
  on('exit', () => go({name:'project', id:p.id}));
  if(!tick) tick = setInterval(updateClocks, 100);
}
function updateClocks(){
  if(view.name !== 'observe') return;
  const p = getProject(view.id); const s = p && p.sessions.find(x => x.id === view.sid); if(!s) return;
  const el = elapsed(s); const cur = currentEvent(s);
  const a = document.getElementById('tMain'), b = document.getElementById('tTask');
  if(a) a.textContent = fmtDur(el);
  if(b && cur) b.textContent = fmtDur(el - cur.el);
}
function pendingTask(p){ return p.tasks.find(t => t.pending); }
function commitPending(p, name){
  const t = pendingTask(p); if(!t) return null;
  t.name = name; delete t.pending; return t;
}
function tapTask(p, s, taskId){
  if(s.status === 'paused' || s.status === 'stopped') return;
  const pend = pendingTask(p);
  if(pend){
    const typed = (view.newText || '').trim();
    if(typed){ commitPending(p, typed); }           // name typed but Add not pressed: keep it
    else {                                          // box tapped but nothing typed: discard it
      p.tasks = p.tasks.filter(t => t !== pend);
      s.events = s.events.filter(e => e.taskId !== pend.id);
      if(!s.events.length){ s.startWall = null; s.status = 'ready'; s.pauses = []; }
    }
    view.newText = '';
  }
  const now = Date.now();
  if(s.status === 'ready'){ s.startWall = now; s.status = 'running'; }
  s.events.push({taskId, wall:now, el:elapsed(s, now)});
  p.updated = now; persist();
  renderObserve();
}
function stopSession(p, s){
  const pend = pendingTask(p);
  if(pend){ commitPending(p, (view.newText || '').trim() || `Unnamed task ${pend.num}`); view.newText = ''; }
  const lp = s.pauses[s.pauses.length-1];
  // The stop moment is the moment the pause began (paused time is not counted).
  const endEl = lp && lp.to == null ? (lp.from - s.startWall - s.pauses.slice(0,-1).reduce((x,q) => x + (q.to - q.from), 0)) : elapsed(s);
  if(lp && lp.to == null) lp.to = lp.from;
  s.endEl = endEl; s.endWall = Date.now(); s.status = 'stopped';
  p.updated = Date.now(); persist();
  go({name:'results', id:p.id, sid:s.id});
}

/* ===================== Excel (.xlsx) writer – no external libraries ===================== */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(buf){ let c = 0xFFFFFFFF; for(let i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files){ // files: [{name, data:string}] -> Blob (STORED, no compression)
  const enc = new TextEncoder(); const parts = []; const central = []; let offset = 0;
  const d = new Date(); const dosTime = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  const dosDate = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dosTime,true); h.setUint16(12,dosDate,true); h.setUint32(14,crc,true);
    h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(h.buffer, name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dosTime,true); c.setUint16(14,dosDate,true); c.setUint32(16,crc,true);
    c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true);
    c.setUint32(42,offset,true);
    central.push(c.buffer, name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s,b) => s + (b.byteLength ?? b.length), 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true); e.setUint32(16,offset,true);
  return new Blob([...parts, ...central, e.buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xesc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''); }
function colName(i){ let s=''; i++; while(i){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
// Excel serial date in LOCAL time
function xlDate(ms){ const off = new Date(ms).getTimezoneOffset()*60000; return (ms - off)/86400000 + 25569; }
function xlDur(ms){ return ms/86400000; }
/* cell: string | number | {v, s, f} ; styles: 0 normal,1 header,2 date,3 time,4 duration,5 number 0.0,6 bold,7 bold duration,8 percent,9 title */
function sheetXml(rows, widths, freeze=0){
  const out = [];
  rows.forEach((row, r) => {
    if(!row) return;
    const cells = row.map((cell, c) => {
      if(cell == null || cell === '') return '';
      const ref = colName(c) + (r+1);
      const o = (typeof cell === 'object') ? cell : {v:cell};
      const s = o.s ? ` s="${o.s}"` : '';
      if(o.f) return `<c r="${ref}"${s}><f>${xesc(o.f)}</f></c>`;
      if(typeof o.v === 'number' && isFinite(o.v)) return `<c r="${ref}"${s}><v>${o.v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${xesc(o.v)}</t></is></c>`;
    }).join('');
    out.push(`<row r="${r+1}">${cells}</row>`);
  });
  const cols = widths.map((w,i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
  const pane = freeze ? `<sheetViews><sheetView workbookViewId="0"><pane ySplit="${freeze}" topLeftCell="A${freeze+1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` : '';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${pane}<cols>${cols}</cols><sheetData>${out.join('')}</sheetData></worksheet>`;
}

<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((s,i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`;

<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">

<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left/><right/><top style="medium"><color rgb="FF103273"/></top><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="11">

function fileStamp(ms){ const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; }

    {v:xlDur(r.el), s:4}, {v:xlDur(r.dur), s:4}, {v:round1(r.dur), s:5}]));

    [{v:`${p.name} – summary by task`, s:9}], null,
    [H('Task No.'), H('Task'), H('Count'), H('Total time'), H('Average'), H('Min'), H('Max'), H('Total (s)'), H('% of overall')],
  ];
  sum.forEach(o => u.push([o.num, o.name, o.count, {v:xlDur(o.total), s:4}, {v:xlDur(o.avg), s:4}, {v:xlDur(o.min), s:4},
    {v:xlDur(o.max), s:4}, {v:round1(o.total), s:5}, {v:o.pct, s:8}]));

  u.push([{v:'Overall time', s:6}, {v:'', s:6}, sum.length ? {f:`SUM(C4:C${sl})`, s:6} : {v:0, s:6},
    sum.length ? {f:`SUM(D4:D${sl})`, s:7} : {v:0, s:7}, {v:'', s:6}, {v:'', s:6}, {v:'', s:6},

  const blob = buildWorkbook([
    {name:'Timings', xml:sheetXml(t, [14,10,40,12,16,16,14,13], head)},
    {name:'Summary by task', xml:sheetXml(u, [10,40,8,14,14,14,14,11,13], 3)},
  ]);
  downloadBlob(blob, `${safeName(p.name)}_${fileStamp(s.startWall)}.xlsx`);
}
async function downloadBlob(blob, filename){
  // On phones, the share sheet is the most reliable way to save / send a file
  try{
    const file = new File([blob], filename, {type:blob.type});
    if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename}); return;
    }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`Saved ${filename}`);
}

/* Keep timing correct if the page reloads mid-study */
window.addEventListener('beforeunload', persist);
render();

/* Offline support: save the app on the device the first time it is opened online */
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
/* Ask the browser not to clear saved projects when storage runs low */
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
